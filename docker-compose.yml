version: "3.9"

services:
  # Container da aplicação (API de tarefas em Flask)
  app:
    build: .
    container_name: codefactory-taskmanager-app
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://codefactory:codefactory@db:5432/taskmanager
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Container do banco de dados PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: codefactory-taskmanager-db
    environment:
      POSTGRES_USER: codefactory
      POSTGRES_PASSWORD: codefactory
      POSTGRES_DB: taskmanager
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codefactory -d taskmanager"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db-data:
